<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="850" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#bd00ff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00f3ff" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="846" height="246" rx="14" fill="url(#bg)" stroke="#00f3ff" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="2" y="2" width="846" height="246" rx="14" fill="url(#grid)"/>

  <rect x="2" y="-80" width="846" height="80" fill="url(#scan)">
    <animate attributeName="y" from="-80" to="250" dur="5s" repeatCount="indefinite"/>
  </rect>

  <rect x="44" y="42" width="172" height="22" rx="4" fill="#00f3ff" fill-opacity="0.1" stroke="#00f3ff" stroke-width="0.8"/>
  <circle cx="56" cy="53" r="3.5" fill="#00f3ff">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="66" y="57" fill="#00f3ff" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">SYS.ONLINE // LVL 22</text>

  <text x="44" y="106" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800">Lucas Honorato</text>
  
  <rect x="44" y="120" width="145" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="110;185;110" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="44" y="152" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">Software Engineering · Full-Stack · IoT &amp; Infra</text>
  <text x="44" y="182" fill="#64748b" font-family="monospace" font-size="14" font-weight="600">@honoratoog</text>

  <g transform="translate(485, 36)">
    <rect x="0" y="0" width="325" height="178" rx="10" fill="#060911" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="178" rx="2" fill="url(#accent)"/>

    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>

    <text x="18" y="48" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold">$ npm run check</text>
    <text x="18" y="65" fill="#64748b" font-family="monospace" font-size="11.5">next build · tsc · prisma · eslint</text>
    <text x="18" y="83" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">✔ all checks passed</text>

    <text x="18" y="112" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold">$ mqtt connect wss://esp32-node</text>
    <text x="18" y="130" fill="#00f3ff" font-family="monospace" font-size="12" font-weight="bold">⚡ telemetry &amp; sensors online</text>

    <text x="18" y="158" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">✔ bgp links &amp; vms operational</text>
    <rect x="232" y="147" width="7" height="13" fill="#00f3ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
