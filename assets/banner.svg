.hud-container {
font-family: 'Courier New', Courier, monospace;
background: radial-gradient(circle at 15% 50%, #0f172a 0%, #060911 100%);
border: 1px solid #00f3ff44;
border-radius: 12px;
height: 256px;
padding: 28px 36px;
box-sizing: border-box;
display: flex;
justify-content: space-between;
align-items: center;
position: relative;
overflow: hidden;
box-shadow: inset 0 0 30px #00f3ff15;
}
.hud-grid {
position: absolute;
inset: 0;
background-image:
linear-gradient(to right, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
linear-gradient(to bottom, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
background-size: 25px 25px;
}
.scanline {
width: 100%;
height: 80px;
background: linear-gradient(0deg, rgba(0,243,255,0) 0%, rgba(0,243,255,0.08) 50%, rgba(0,243,255,0) 100%);
position: absolute;
left: 0;
top: -80px;
animation: scan 5s linear infinite;
}
@keyframes scan {
0% { top: -80px; }
100% { top: 260px; }
}
.left-col {
z-index: 2;
}
.tag-status {
display: inline-block;
font-size: 11px;
color: #00f3ff;
border: 1px solid #00f3ff;
padding: 2px 8px;
border-radius: 4px;
margin-bottom: 10px;
letter-spacing: 2px;
text-transform: uppercase;
background: rgba(0, 243, 255, 0.1);
}
.title {
font-size: 38px;
font-weight: 800;
color: #ffffff;
margin: 0;
letter-spacing: 1px;
text-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
}
.gradient-bar {
height: 4px;
width: 140px;
background: linear-gradient(90deg, #00f3ff, #bd00ff);
margin: 12px 0;
border-radius: 2px;
animation: pulse 2s infinite alternate;
}
@keyframes pulse {
0% { width: 110px; opacity: 0.8; }
100% { width: 170px; opacity: 1; box-shadow: 0 0 10px #00f3ff; }
}
.subtitle {
color: #cbd5e1;
font-size: 15px;
margin: 6px 0 4px 0;
}
.handle {
color: #00f3ff;
font-size: 13px;
opacity: 0.8;
}
.terminal {
z-index: 2;
background: rgba(9, 13, 22, 0.9);
border: 1px solid #1e293b;
border-left: 3px solid #bd00ff;
border-radius: 8px;
width: 320px;
padding: 14px;
font-size: 12px;
color: #94a3b8;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
.dots {
display: flex;
gap: 6px;
margin-bottom: 10px;
}
.dot { width: 10px; height: 10px; border-radius: 50%; }
.r { background: #ef4444; }
.y { background: #f59e0b; }
.g { background: #10b981; }
.cmd { color: #e2e8f0; margin-top: 6px; }
.ok { color: #10b981; }
.info { color: #00f3ff; }
.blink { animation: blinker 1s steps(2, start) infinite; color: #00f3ff; font-weight: bold; }
@keyframes blinker { to { visibility: hidden; } }

